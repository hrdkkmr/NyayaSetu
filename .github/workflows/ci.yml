name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: nyayasetu
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U ci" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests alembic
      - run: mypy
      - run: pytest -q
      - name: Migrations apply cleanly on PostgreSQL + pgvector
        env:
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/nyayasetu
        run: |
          alembic upgrade head
          alembic check
          python -m app.cli ingest
          alembic downgrade base

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - name: Start backend
        working-directory: backend
        env:
          SECRET_KEY: ci-secret-key-that-is-long-enough-0123456789
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          python -m app.cli ingest
          nohup uvicorn app.main:app --port 8000 > ../backend.log 2>&1 &
      - name: Build and start frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_WS_URL: ws://localhost:8000
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          nohup npx next start -p 3000 > ../frontend.log 2>&1 &
          npx wait-on -t 60000 http://localhost:3000 http://localhost:8000/health
      - run: npx playwright test
        working-directory: frontend
      - if: failure()
        run: tail -n 200 backend.log frontend.log
