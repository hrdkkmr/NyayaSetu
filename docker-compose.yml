# Local full stack: PostgreSQL + pgvector, Redis, MinIO (S3), API, worker, frontend.
#   cp .env.example .env   # then set SECRET_KEY and STORAGE_ENCRYPTION_KEY
#   docker compose up --build
# Open http://localhost:3000. API docs: http://localhost:8000/api/docs

x-backend-env: &backend-env
  ENVIRONMENT: development
  DATABASE_URL: postgresql+asyncpg://nyayasetu:nyayasetu@db:5432/nyayasetu
  REDIS_URL: redis://redis:6379/0
  STORAGE_BACKEND: s3
  S3_BUCKET: nyayasetu-documents
  S3_ENDPOINT_URL: http://minio:9000
  S3_REGION: us-east-1
  S3_ACCESS_KEY_ID: nyayasetu
  S3_SECRET_ACCESS_KEY: nyayasetu-minio-secret
  CORS_ORIGINS: http://localhost:3000

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: nyayasetu
      POSTGRES_PASSWORD: nyayasetu
      POSTGRES_DB: nyayasetu
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nyayasetu"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nyayasetu
      MINIO_ROOT_PASSWORD: nyayasetu-minio-secret
    volumes: [miniodata:/data]
    ports: ["9001:9001"]

  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on: [minio]
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 nyayasetu nyayasetu-minio-secret; do sleep 1; done;
             mc mb --ignore-existing local/nyayasetu-documents"

  migrate:
    build: ./backend
    env_file: [.env]
    environment: *backend-env
    depends_on:
      db: {condition: service_healthy}
    command: sh -c "alembic upgrade head && python -m app.cli ingest"

  api:
    build: ./backend
    env_file: [.env]
    environment: *backend-env
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    ports: ["8000:8000"]

  worker:
    build: ./backend
    env_file: [.env]
    environment: *backend-env
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    command: arq app.worker.WorkerSettings

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_WS_URL: ws://localhost:8000
    environment:
      BACKEND_URL: http://api:8000
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  pgdata:
  miniodata:
